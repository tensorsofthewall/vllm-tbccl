[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-tbccl"
version = "0.2.0.dev0"
description = "Out-of-tree vLLM integration: route vLLM device-group communication through torch-tbccl (ProcessGroupTBCCL)"
requires-python = ">=3.10"
dependencies = ["torch", "vllm", "torch-tbccl"]

[project.entry-points."vllm.platform_plugins"]
tbccl = "vllm_tbccl.platform:tbccl_platform_plugin"

[tool.setuptools]
packages = ["vllm_tbccl", "vllm_tbccl.backends"]
