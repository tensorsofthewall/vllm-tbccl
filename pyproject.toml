[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-tbccl"
version = "0.2.0rc1"
description = "Out-of-tree vLLM integration: vLLM device-group communication over TBCCL through a bundled, private c10d backend"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sandesh Bharadwaj" }]
requires-python = ">=3.13,<3.14"  # the tested tuple; the bundled native module is a cp313 extension
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
]
# The bundled native module is tied to one torch minor series (checked at import); vllm pins its own torch.
dependencies = ["torch>=2.13,<2.14", "vllm"]

[project.urls]
Documentation = "https://vllm-tbccl.tensorsofthewall.com/"
Repository = "https://github.com/tensorsofthewall/vllm-tbccl"
Issues = "https://github.com/tensorsofthewall/vllm-tbccl/issues"

[project.entry-points."vllm.platform_plugins"]
tbccl = "vllm_tbccl.platform:tbccl_platform_plugin"

[tool.setuptools]
packages = ["vllm_tbccl", "vllm_tbccl.backends", "vllm_tbccl.patches"]

[tool.setuptools.package-data]
"vllm_tbccl.patches" = ["*.patch"]
